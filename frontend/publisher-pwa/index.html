<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#075E54" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>VentasPlus</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <style>
    :root {
      --teal: #075E54; --teal2: #128C7E; --green: #25D366;
      --bg: #0B141A; --panel: #111B21; --panel2: #202C33; --line: #2A3942;
      --text: #E9EDEF; --muted: #8696A0; --bubble-out: #005C4B; --bubble-in: #202C33;
      --safe-t: env(safe-area-inset-top,0px); --safe-b: env(safe-area-inset-bottom,0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    button, input, textarea { font: inherit; color: inherit; }
    .appbar {
      position: sticky; top: 0; z-index: 20; background: var(--teal);
      padding: calc(.55rem + var(--safe-t)) .75rem .55rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .appbar h1 { margin: 0; font-size: 1.15rem; font-weight: 600; flex: 1; }
    .icon {
      width: 40px; height: 40px; border: 0; border-radius: 50%;
      background: transparent; color: #fff; display: inline-flex;
      align-items: center; justify-content: center; cursor: pointer; padding: 0;
    }
    .icon:active { background: rgba(255,255,255,.12); }
    .icon svg { width: 22px; height: 22px; fill: currentColor; }
    .tabs {
      display: flex; background: var(--teal); padding: 0 .5rem;
      border-bottom: 1px solid rgba(0,0,0,.15);
    }
    .tabs button {
      flex: 1; border: 0; background: transparent; color: rgba(255,255,255,.7);
      padding: .7rem .25rem; font-weight: 700; font-size: .8rem; letter-spacing: .04em;
      border-bottom: 3px solid transparent; cursor: pointer;
    }
    .tabs button.on { color: #fff; border-bottom-color: #fff; }
    .status-line {
      background: var(--panel); border-bottom: 1px solid var(--line);
      padding: .45rem 1rem; font-size: .78rem; color: var(--muted);
      display: flex; align-items: center; gap: .45rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8696A0; }
    .dot.on { background: var(--green); }
    .dot.warn { background: #f5c26b; }
    .list { background: var(--panel); min-height: 50vh; }
    .chat-row {
      width: 100%; display: flex; gap: .75rem; align-items: center;
      padding: .7rem 1rem; border: 0; border-bottom: 1px solid rgba(42,57,66,.65);
      background: transparent; text-align: left; cursor: pointer;
    }
    .chat-row:active { background: var(--panel2); }
    .av {
      width: 52px; height: 52px; border-radius: 50%; background: var(--panel2);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      border: 1px solid var(--line); color: var(--muted);
    }
    .av svg { width: 26px; height: 26px; fill: currentColor; }
    .chat-row .t { font-weight: 600; font-size: .97rem; margin: 0 0 .12rem; }
    .chat-row .s { margin: 0; font-size: .8rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw; }
    .chat-row .meta { margin-left: auto; font-size: .7rem; color: var(--muted); flex-shrink: 0; }
    .fab {
      position: fixed; right: 1rem; bottom: calc(1.15rem + var(--safe-b));
      width: 58px; height: 58px; border-radius: 50%; border: 0;
      background: var(--teal2); color: #fff; z-index: 30;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
    }
    .fab svg { width: 26px; height: 26px; fill: currentColor; }
    .sheet {
      position: fixed; inset: 0; z-index: 40; background: var(--bg);
      display: none; flex-direction: column;
    }
    .sheet.open { display: flex; }
    .sheet-bar {
      background: var(--teal); padding: calc(.5rem + var(--safe-t)) .4rem .5rem;
      display: flex; align-items: center; gap: .25rem;
    }
    .sheet-bar .title { flex: 1; font-weight: 600; font-size: 1.05rem; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .msgs {
      flex: 1; overflow-y: auto; padding: .75rem .7rem calc(.5rem + var(--safe-b));
      background: #0b141a url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='%230b141a'/%3E%3Cpath d='M30 5l2 8h8l-6 5 2 8-6-5-6 5 2-8-6-5h8z' fill='%23111b21' opacity='.5'/%3E%3C/svg%3E");
      display: flex; flex-direction: column; gap: .35rem;
    }
    .bubble {
      max-width: 82%; padding: .45rem .6rem .35rem; border-radius: 8px;
      font-size: .95rem; line-height: 1.35; position: relative;
    }
    .bubble.in { align-self: flex-start; background: var(--bubble-in); border-top-left-radius: 0; }
    .bubble.out { align-self: flex-end; background: var(--bubble-out); border-top-right-radius: 0; }
    .bubble img { max-width: 100%; border-radius: 6px; display: block; margin-bottom: .25rem; }
    .bubble .time { font-size: .65rem; color: rgba(255,255,255,.45); text-align: right; margin-top: .15rem; }
    .composer {
      display: flex; gap: .4rem; align-items: flex-end;
      padding: .45rem .55rem calc(.45rem + var(--safe-b));
      background: var(--panel); border-top: 1px solid var(--line);
    }
    .composer input {
      flex: 1; border: 0; background: var(--panel2); border-radius: 22px;
      padding: .7rem 1rem; font-size: 16px; outline: none;
    }
    .composer .send {
      width: 46px; height: 46px; border-radius: 50%; border: 0;
      background: var(--teal2); color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .composer .send svg { width: 20px; height: 20px; fill: currentColor; }
    .pad { padding: 1rem; }
    label { display: block; font-size: .75rem; color: var(--muted); margin: .55rem 0 .3rem; font-weight: 600; }
    input.field, textarea.field, select.field {
      width: 100%; background: var(--panel2); border: 1px solid var(--line);
      border-radius: 10px; padding: .75rem .85rem; font-size: 16px;
    }
    textarea.field { min-height: 80px; }
    .btn {
      width: 100%; min-height: 48px; border: 0; border-radius: 24px;
      font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    }
    .btn-green { background: var(--green); color: #054c22; }
    .btn-teal { background: var(--teal2); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .stack { display: flex; flex-direction: column; gap: .55rem; margin-top: .65rem; }
    .code {
      margin-top: .75rem; padding: 1rem; text-align: center; letter-spacing: .22em;
      font-size: 1.55rem; font-weight: 800; color: var(--green); background: var(--panel2);
      border-radius: 12px; font-family: ui-monospace, monospace;
    }
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5rem + var(--safe-b));
      background: var(--panel2); border: 1px solid var(--line); padding: .6rem 1rem;
      border-radius: 8px; font-size: .85rem; z-index: 80; display: none; max-width: 92%; text-align: center;
    }
    .toast.show { display: block; }
    .hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .stage { background: #000; border-radius: 12px; overflow: hidden; margin: .4rem 0; }
    .stage canvas { width: 100%; max-height: 40vh; display: block; touch-action: none; }
    .offer img { width: 100%; display: block; border-radius: 12px; }
    .use-offer {
      margin-top: .25rem; border: 0; background: rgba(37,211,102,.2); color: var(--green);
      border-radius: 6px; padding: .25rem .5rem; font-size: .75rem; font-weight: 700; cursor: pointer;
    }
    .empty { padding: 2rem 1.25rem; text-align: center; color: var(--muted); font-size: .9rem; }
    .search {
      margin: .5rem .75rem; background: var(--panel2); border-radius: 10px;
      display: flex; align-items: center; gap: .4rem; padding: .35rem .65rem;
    }
    .search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; padding: .4rem 0; }
    .search svg { width: 18px; height: 18px; fill: var(--muted); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="viewMain">
    <header class="appbar">
      <h1>VentasPlus</h1>
      <button type="button" class="icon" id="btnLink" title="Vincular" aria-label="Vincular">
        <svg viewBox="0 0 24 24"><path d="M17 7h-4v2h4c1.65 0 3 1.35 3 3s-1.35 3-3 3h-4v2h4c2.76 0 5-2.24 5-5s-2.24-5-5-5zm-6 8H7c-1.65 0-3-1.35-3-3s1.35-3 3-3h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-2zm-3-4h8v2H8z"/></svg>
      </button>
      <button type="button" class="icon" id="btnRefresh" title="Actualizar" aria-label="Actualizar">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 0 0-8 8h2a6 6 0 0 1 9.9-4.6L12 11h8V3l-2.35 3.35zM12 20a8 8 0 0 0 8-8h-2a6 6 0 0 1-9.9 4.6L12 13H4v8l2.35-3.35A7.95 7.95 0 0 0 12 20z"/></svg>
      </button>
    </header>
    <div class="tabs">
      <button type="button" class="on" data-tab="chats">CHATS</button>
      <button type="button" data-tab="tools">OFERTAS</button>
    </div>
    <div class="status-line"><span class="dot" id="dot"></span><span id="statusText">Comprobando…</span></div>

    <div id="tabChats">
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="chatFilter" placeholder="Buscar…" autocomplete="off" />
      </div>
      <div class="list" id="chatList"><div class="empty">Vincula WhatsApp para ver chats y grupos</div></div>
    </div>

    <div id="tabTools" style="display:none">
      <div class="list">
        <button type="button" class="chat-row" id="btnNewOffer">
          <div class="av"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
          <div><p class="t">Nueva oferta</p><p class="s">Foto → precio → enviar</p></div>
        </button>
        <button type="button" class="chat-row" id="btnStatus">
          <div class="av"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h2v-6h-2v6zm0-8h2V7h-2v2z"/></svg></div>
          <div><p class="t">Publicar en estado</p><p class="s">Estado de WhatsApp</p></div>
        </button>
      </div>
      <p class="empty" id="deviceLabel" style="padding-top:.5rem"></p>
    </div>
  </div>

  <button type="button" class="fab" id="fab" aria-label="Nueva oferta">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
  <div class="toast" id="toast"></div>
  <input type="file" id="inputCamera" class="hidden" accept="image/*" capture="environment" />
  <input type="file" id="inputGallery" class="hidden" accept="image/*" />

  <!-- Chat view -->
  <div class="sheet" id="sheetChat">
    <div class="sheet-bar">
      <button type="button" class="icon" id="closeChat" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="title" id="chatTitle">Chat</div>
      <button type="button" class="icon" id="btnChatOffer" title="Oferta" aria-label="Oferta"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></button>
    </div>
    <div class="msgs" id="msgList"></div>
    <div class="composer">
      <input id="msgInput" placeholder="Mensaje" autocomplete="off" />
      <button type="button" class="send" id="btnSendMsg" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>

  <!-- Link -->
  <div class="sheet" id="sheetLink">
    <div class="sheet-bar">
      <button type="button" class="icon" id="closeLink" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="title">Vincular WhatsApp</div>
    </div>
    <div class="sheet-body pad">
      <p style="color:var(--muted);font-size:.9rem;line-height:1.45;margin:0 0 .75rem">
        En el teléfono: WhatsApp → Dispositivos vinculados → Vincular → <strong style="color:var(--text)">Vincular con número</strong>.
      </p>
      <label>Número (código de país)</label>
      <input class="field" id="pairPhone" inputmode="tel" placeholder="56912345678" />
      <div class="stack">
        <button type="button" class="btn btn-green" id="btnPair">Obtener código</button>
        <button type="button" class="btn btn-ghost" id="btnUnlink" style="display:none">Desvincular este teléfono</button>
      </div>
      <div class="code" id="pairCode" style="display:none"></div>
      <p id="pairHint" style="color:var(--muted);font-size:.85rem;margin-top:.75rem"></p>
    </div>
  </div>

  <!-- Offer -->
  <div class="sheet" id="sheetOffer">
    <div class="sheet-bar">
      <button type="button" class="icon" id="closeOffer" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="title" id="offerTitle">Nueva oferta</div>
    </div>
    <div class="sheet-body pad">
      <div id="oPhoto">
        <div class="stack">
          <button type="button" class="btn btn-teal" id="btnCam">Tomar foto</button>
          <button type="button" class="btn btn-green" id="btnGal">Galería</button>
        </div>
        <div id="editBlock" style="display:none;margin-top:.75rem">
          <div class="stage"><canvas id="cropCanvas"></canvas></div>
          <label>Texto en la foto</label>
          <input class="field" id="overlayText" placeholder="Opcional" />
          <div class="stack">
            <button type="button" class="btn btn-ghost" id="btnApplyText">Poner texto</button>
            <button type="button" class="btn btn-green" id="btnToData">Siguiente</button>
          </div>
        </div>
      </div>
      <div id="oData" style="display:none">
        <label>Nombre</label><input class="field" id="prodName" />
        <label>Precio</label><input class="field" id="prodPrice" inputmode="decimal" />
        <label>Detalle</label><textarea class="field" id="prodDesc"></textarea>
        <div class="stack">
          <button type="button" class="btn btn-green" id="btnToSend">Continuar</button>
          <button type="button" class="btn btn-ghost" id="btnBackPhoto">Volver</button>
        </div>
      </div>
      <div id="oSend" style="display:none">
        <div class="offer"><img id="offerPreview" alt="" /></div>
        <label>Destino (opcional si envías desde un chat)</label>
        <select class="field" id="waDestSelect" multiple size="5"></select>
        <input class="field" id="waDest" placeholder="Número manual" style="margin-top:.4rem" />
        <div class="stack">
          <button type="button" class="btn btn-green" id="btnPublish">Enviar oferta</button>
          <button type="button" class="btn btn-teal" id="btnPubStatus">Publicar en estado</button>
          <button type="button" class="btn btn-ghost" id="btnShare">Compartir…</button>
          <button type="button" class="btn btn-ghost" id="btnBackData">Volver</button>
        </div>
        <p id="sendStatus" style="color:var(--muted);font-size:.85rem;margin-top:.6rem"></p>
      </div>
    </div>
  </div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var toast = function(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, 3200); };
  var API_BASE = (localStorage.getItem('vp_api_base')||'https://ventasplus-api.onrender.com').replace(/\/$/,'');
  function getDeviceId(){
    var k='vp_device_id', id=localStorage.getItem(k);
    if(!id){ id='d'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(k,id); }
    return id.replace(/[^a-zA-Z0-9_-]/g,'').slice(0,64);
  }
  var DEVICE_ID = getDeviceId();
  function apiFetch(path, opts){
    opts=opts||{}; var h=Object.assign({}, opts.headers||{});
    h['X-Device-Id']=DEVICE_ID;
    if(opts.body && !h['Content-Type']) h['Content-Type']='application/json';
    opts.headers=h;
    return fetch(API_BASE+path, opts);
  }
  $('deviceLabel').textContent = 'Dispositivo '+DEVICE_ID.slice(0,12)+'…';

  var linked=false, chats=[], currentJid=null, currentName='';
  var sourceImg=null, cropRect=null, dragging=false, startX=0, startY=0;
  var productPhotoDataURL=null, offerDataURL=null, offerTargetJid=null;

  function setStatus(kind, text){
    $('dot').className='dot'+(kind==='on'?' on':kind==='warn'?' warn':'');
    $('statusText').textContent=text;
  }
  function openSheet(id){ $(id).classList.add('open'); }
  function closeSheet(id){ $(id).classList.remove('open'); }

  // Tabs
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      var tab=b.getAttribute('data-tab');
      $('tabChats').style.display = tab==='chats'?'block':'none';
      $('tabTools').style.display = tab==='tools'?'block':'none';
    };
  });

  $('btnLink').onclick=function(){ openSheet('sheetLink'); };
  $('closeLink').onclick=function(){ closeSheet('sheetLink'); };
  $('btnRefresh').onclick=function(){ refreshAll(); toast('Actualizado'); };
  $('fab').onclick=$('btnNewOffer').onclick=function(){ offerTargetJid=null; openOffer(); };
  $('closeOffer').onclick=function(){ closeSheet('sheetOffer'); };
  $('closeChat').onclick=function(){ closeSheet('sheetChat'); currentJid=null; };

  function refreshAll(){
    apiFetch('/api/v1/info').then(function(r){ return r.json(); }).then(function(info){
      linked = !!info.openwa_connected;
      if(linked){
        setStatus('on','Conectado');
        $('btnUnlink').style.display='flex';
        loadChats();
      } else {
        setStatus('warn','WhatsApp no vinculado');
        $('btnUnlink').style.display='none';
        $('chatList').innerHTML='<div class="empty">Vincula WhatsApp para ver tus chats y grupos</div>';
      }
    }).catch(function(){ setStatus('','Sin conexión con el servidor'); });
  }

  $('btnPair').onclick=function(){
    var phone=($('pairPhone').value||'').replace(/\D/g,'');
    if(phone.length<10) return toast('Número con código de país');
    $('btnPair').disabled=true; $('pairCode').style.display='none';
    $('pairHint').textContent='Generando…';
    apiFetch('/api/whatsapp/pairing-code',{ method:'POST', body: JSON.stringify({ phoneNumber: phone }) })
      .then(function(r){ return r.json(); })
      .then(function(data){
        $('btnPair').disabled=false;
        if(data.pairingCode){
          $('pairCode').style.display='block';
          $('pairCode').textContent=data.pairingCode;
          $('pairHint').textContent='Escríbelo ahora en WhatsApp';
          var n=0, t=setInterval(function(){ n++; refreshAll(); if(linked||n>40) clearInterval(t); }, 3000);
        } else {
          $('pairHint').textContent=data.error||'No se pudo generar el código';
        }
      }).catch(function(){ $('btnPair').disabled=false; $('pairHint').textContent='Error de conexión'; });
  };
  $('btnUnlink').onclick=function(){
    if(!confirm('¿Desvincular solo este teléfono?')) return;
    apiFetch('/api/whatsapp/unlink',{ method:'POST', body:'{}' }).then(function(){ linked=false; toast('Desvinculado'); refreshAll(); });
  };

  function loadChats(){
    apiFetch('/api/whatsapp/chats').then(function(r){ return r.json(); }).then(function(data){
      chats = (data && data.chats) || [];
      renderChatList();
    }).catch(function(){});
  }
  function renderChatList(){
    var q=($('chatFilter').value||'').toLowerCase();
    var list = chats.filter(function(c){
      var n=(c.name||c.id||'').toLowerCase();
      return !q || n.indexOf(q)>=0;
    });
    if(!list.length){
      $('chatList').innerHTML='<div class="empty">No hay chats aún. Cuando lleguen mensajes aparecerán aquí.</div>';
      return;
    }
    var groupSvg = '<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>';
    var personSvg = '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    $('chatList').innerHTML = list.map(function(c){
      var isG = c.type==='group' || String(c.id).indexOf('@g.us')>=0;
      return '<button type="button" class="chat-row" data-jid="'+String(c.id).replace(/"/g,'')+'" data-name="'+String(c.name||c.id).replace(/"/g,'&quot;')+'">'+
        '<div class="av">'+(isG?groupSvg:personSvg)+'</div>'+
        '<div style="min-width:0;flex:1"><p class="t">'+String(c.name||c.id).replace(/</g,'')+'</p>'+
        '<p class="s">'+(c.lastText||'').replace(/</g,'').slice(0,60)+'</p></div></button>';
    }).join('');
    $('chatList').querySelectorAll('.chat-row').forEach(function(row){
      row.onclick=function(){ openChat(row.getAttribute('data-jid'), row.getAttribute('data-name')); };
    });
  }
  $('chatFilter').oninput=function(){ renderChatList(); };

  function openChat(jid, name){
    currentJid=jid; currentName=name||jid;
    $('chatTitle').textContent=currentName;
    $('msgList').innerHTML='<div class="empty">Cargando…</div>';
    openSheet('sheetChat');
    loadMessages();
  }
  function loadMessages(){
    if(!currentJid) return;
    apiFetch('/api/whatsapp/messages?jid='+encodeURIComponent(currentJid)+'&limit=80')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var items=(data&&data.items)||[];
        if(!items.length){
          $('msgList').innerHTML='<div class="empty">'+(data.note||'Sin mensajes en caché todavía. Los nuevos aparecerán aquí.')+'</div>';
          return;
        }
        $('msgList').innerHTML = items.map(function(m){
          var cls = m.fromMe ? 'out' : 'in';
          var body = '';
          if(m.type==='image' && m.dataUrl){
            body += '<img src="'+m.dataUrl+'" alt=""/>';
            if(m.text) body += '<div>'+esc(m.text)+'</div>';
            body += '<button type="button" class="use-offer" data-img="'+m.dataUrl.replace(/"/g,'&quot;')+'">Usar en oferta</button>';
          } else {
            body += '<div>'+esc(m.text||'')+'</div>';
          }
          var tm = m.ts ? new Date(m.ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
          return '<div class="bubble '+cls+'">'+body+'<div class="time">'+tm+'</div></div>';
        }).join('');
        $('msgList').scrollTop = $('msgList').scrollHeight;
        $('msgList').querySelectorAll('.use-offer').forEach(function(b){
          b.onclick=function(){
            productPhotoDataURL = b.getAttribute('data-img');
            loadSource(productPhotoDataURL);
            offerTargetJid = currentJid;
            openOffer();
            setTimeout(function(){ bakeProductPhoto(); showOfferStep('data'); }, 200);
          };
        });
      }).catch(function(){ $('msgList').innerHTML='<div class="empty">Error al cargar mensajes</div>'; });
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  $('btnSendMsg').onclick=function(){
    var text=($('msgInput').value||'').trim();
    if(!text||!currentJid) return;
    apiFetch('/api/whatsapp/send',{ method:'POST', body: JSON.stringify({ chatId: currentJid, text: text }) })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if(!res.ok){ toast(res.d.error||'No se pudo enviar'); return; }
        $('msgInput').value='';
        loadMessages();
      }).catch(function(){ toast('Error de envío'); });
  };
  $('msgInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); $('btnSendMsg').click(); } });
  $('btnChatOffer').onclick=function(){ offerTargetJid=currentJid; openOffer(); };

  // Offer flow
  function openOffer(){ showOfferStep('photo'); openSheet('sheetOffer'); }
  function showOfferStep(n){
    $('oPhoto').style.display=n==='photo'?'block':'none';
    $('oData').style.display=n==='data'?'block':'none';
    $('oSend').style.display=n==='send'?'block':'none';
    $('offerTitle').textContent=n==='photo'?'Foto':n==='data'?'Datos':'Enviar';
  }
  $('btnCam').onclick=function(){ $('inputCamera').click(); };
  $('btnGal').onclick=function(){ $('inputGallery').click(); };
  function onFile(inp){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(){ loadSource(rd.result); }; rd.readAsDataURL(f); inp.value='';
  }
  $('inputCamera').onchange=function(){ onFile(this); };
  $('inputGallery').onchange=function(){ onFile(this); };

  function loadSource(url){
    sourceImg=new Image();
    sourceImg.onload=function(){ $('editBlock').style.display='block'; setupCanvas(); };
    sourceImg.src=url;
  }
  function setupCanvas(){
    var c=$('cropCanvas'), maxW=Math.min(600, innerWidth-32), sc=Math.min(1, maxW/sourceImg.width);
    c.width=Math.round(sourceImg.width*sc); c.height=Math.round(sourceImg.height*sc);
    cropRect=null; redraw();
  }
  function redraw(){
    var c=$('cropCanvas'), ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height); ctx.drawImage(sourceImg,0,0,c.width,c.height);
    if(cropRect&&cropRect.w>2){
      ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,c.width,c.height);
      ctx.clearRect(cropRect.x,cropRect.y,cropRect.w,cropRect.h);
      ctx.drawImage(sourceImg,0,0,c.width,c.height);
      ctx.strokeStyle='#25D366'; ctx.lineWidth=3; ctx.strokeRect(cropRect.x,cropRect.y,cropRect.w,cropRect.h);
    }
  }
  function pos(e){ var r=$('cropCanvas').getBoundingClientRect(); var t=e.touches?e.touches[0]:e;
    return {x:((t.clientX-r.left)/r.width)*$('cropCanvas').width, y:((t.clientY-r.top)/r.height)*$('cropCanvas').height}; }
  function onDown(e){ e.preventDefault(); dragging=true; var p=pos(e); startX=p.x; startY=p.y; cropRect={x:startX,y:startY,w:0,h:0}; }
  function onMove(e){ if(!dragging)return; e.preventDefault(); var p=pos(e);
    cropRect={x:Math.min(startX,p.x),y:Math.min(startY,p.y),w:Math.abs(p.x-startX),h:Math.abs(p.y-startY)}; redraw(); }
  function onUp(){ dragging=false; }
  $('cropCanvas').addEventListener('mousedown',onDown); $('cropCanvas').addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
  $('cropCanvas').addEventListener('touchstart',onDown,{passive:false}); $('cropCanvas').addEventListener('touchmove',onMove,{passive:false}); $('cropCanvas').addEventListener('touchend',onUp);
  $('btnApplyText').onclick=function(){
    var text=$('overlayText').value.trim(); if(!text) return;
    var c=$('cropCanvas'), ctx=c.getContext('2d'), fs=Math.max(18,Math.round(c.width/16));
    ctx.font='bold '+fs+'px system-ui'; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=4;
    ctx.strokeText(text,16,c.height-24); ctx.fillText(text,16,c.height-24);
    sourceImg=new Image(); sourceImg.onload=function(){ cropRect=null; setupCanvas(); }; sourceImg.src=c.toDataURL('image/jpeg',0.92);
  };
  function bakeProductPhoto(){
    var c=$('cropCanvas'), out=c;
    if(cropRect&&cropRect.w>8){ var t=document.createElement('canvas'); t.width=Math.round(cropRect.w); t.height=Math.round(cropRect.h);
      t.getContext('2d').drawImage(c,cropRect.x,cropRect.y,cropRect.w,cropRect.h,0,0,t.width,t.height); out=t; }
    productPhotoDataURL=out.toDataURL('image/jpeg',0.92);
  }
  $('btnToData').onclick=function(){ if(!sourceImg) return toast('Agrega una foto'); bakeProductPhoto(); showOfferStep('data'); };
  $('btnBackPhoto').onclick=function(){ showOfferStep('photo'); };
  $('btnBackData').onclick=function(){ showOfferStep('data'); };

  function buildOffer(){
    return new Promise(function(resolve,reject){
      if(!productPhotoDataURL) return reject(new Error('Falta foto'));
      var img=new Image();
      img.onload=function(){
        var W=1080,pad=48, name=$('prodName').value.trim()||'Oferta', price=$('prodPrice').value.trim(), desc=$('prodDesc').value.trim();
        var innerW=W-pad*2, imgH=Math.round(innerW*img.height/img.width);
        var textH=160+(desc?80:0);
        var H=pad+imgH+28+textH+pad;
        var canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
        var ctx=canvas.getContext('2d');
        ctx.fillStyle='#0d1b2a'; ctx.fillRect(0,0,W,H);
        ctx.drawImage(img,pad,pad,innerW,imgH);
        ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(pad,pad+imgH+28,innerW,textH);
        ctx.fillStyle='#fff'; ctx.font='700 52px system-ui'; ctx.fillText(name,pad+40,pad+imgH+90);
        if(price){ ctx.fillStyle='#25D366'; ctx.font='800 60px system-ui'; ctx.fillText(price,pad+40,pad+imgH+160); }
        if(desc){ ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='400 32px system-ui'; ctx.fillText(desc.slice(0,80),pad+40,pad+imgH+210); }
        offerDataURL=canvas.toDataURL('image/jpeg',0.92); resolve(offerDataURL);
      };
      img.onerror=function(){ reject(new Error('Foto inválida')); };
      img.src=productPhotoDataURL;
    });
  }
  $('btnToSend').onclick=async function(){
    if(!$('prodName').value.trim()&&!$('prodPrice').value.trim()) return toast('Pon nombre o precio');
    try{ $('offerPreview').src=await buildOffer();
      // fill dest select from chats
      var sel=$('waDestSelect'); sel.innerHTML='';
      chats.forEach(function(c){ var o=document.createElement('option'); o.value=c.id; o.textContent=c.name||c.id; if(offerTargetJid&&c.id===offerTargetJid) o.selected=true; sel.appendChild(o); });
      showOfferStep('send');
    }catch(e){ toast(e.message||'Error'); }
  };

  function selectedDests(){
    var out=[], sel=$('waDestSelect');
    if(sel) for(var i=0;i<sel.selectedOptions.length;i++) if(sel.selectedOptions[i].value) out.push(sel.selectedOptions[i].value);
    if(offerTargetJid && out.indexOf(offerTargetJid)<0) out.unshift(offerTargetJid);
    var m=($('waDest').value||'').trim(); if(m) out.push(m);
    return out.filter(function(v,i,a){ return a.indexOf(v)===i; });
  }

  $('btnPublish').onclick=async function(){
    if(!offerDataURL) await buildOffer();
    var dests=selectedDests();
    if(!dests.length) return toast('Elige al menos un destino');
    $('sendStatus').textContent='Enviando…';
    var res=await apiFetch('/api/publish',{ method:'POST', body: JSON.stringify({
      agentId: DEVICE_ID, timestamp: new Date().toISOString(),
      products:[{ name:$('prodName').value.trim(), price:$('prodPrice').value.trim(), description:$('prodDesc').value.trim(), imageBase64: offerDataURL }],
      total:1, destinations:{ facebook:[], whatsapp: dests.map(function(d){ return /^\d{8,15}$/.test(d)?d+'@c.us':d; }) }
    })});
    var data=await res.json();
    if(!res.ok || !(data.whatsapp||[]).some(function(x){return x&&x.ok;})){
      toast((data&&data.message)||(data&&data.error)||'No se pudo enviar (límite o sesión)');
      $('sendStatus').textContent=(data&&data.message)||'Falló el envío';
      return;
    }
    toast('Oferta enviada');
    $('sendStatus').textContent='Enviado';
  };

  $('btnPubStatus').onclick=async function(){
    if(!offerDataURL) await buildOffer();
    var caption=[$('prodName').value.trim(),$('prodPrice').value.trim()].filter(Boolean).join(' · ');
    $('sendStatus').textContent='Publicando estado…';
    var res=await apiFetch('/api/whatsapp/status-post',{ method:'POST', body: JSON.stringify({ text: caption, imageBase64: offerDataURL }) });
    var data=await res.json();
    if(!res.ok || !data.ok){ toast(data.error||'No se pudo publicar el estado'); $('sendStatus').textContent=data.error||'Error'; return; }
    toast('Estado publicado');
    $('sendStatus').textContent='Estado publicado';
  };

  $('btnStatus').onclick=function(){ offerTargetJid=null; openOffer(); toast('Prepara la oferta y usa Publicar en estado'); };

  $('btnShare').onclick=async function(){
    if(!offerDataURL) return;
    try{
      var blob=await (await fetch(offerDataURL)).blob();
      var file=new File([blob],'oferta.jpg',{type:'image/jpeg'});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Oferta'}); return; }
    }catch(e){ if(e&&e.name==='AbortError') return; }
    var a=document.createElement('a'); a.href=offerDataURL; a.download='oferta.jpg'; a.click();
  };

  // poll messages when chat open
  setInterval(function(){ if(currentJid && $('sheetChat').classList.contains('open')) loadMessages(); }, 8000);
  refreshAll();
  setInterval(refreshAll, 15000);
})();
</script>
</body>
</html>
